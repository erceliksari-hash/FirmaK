<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirmaK Üretim Takip</title>
    <style>
        /* Görsel 50_2.jpg'deki orijinal tasarım renkleri ve düzeni */
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        input { width: 100%; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 5px 12px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { background-color: #238636; color: white; border: 1px solid rgba(240,246,252,0.1); border-radius: 6px; padding: 5px 16px; cursor: pointer; width: 100%; }
        .btn-danger { background-color: #da3633; }
        .tab-content { display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="tab-giris" class="tab-content">
        <div class="card">
            <input type="text" id="cArt" placeholder="ARTİKEL / MODEL" oninput="engine()">
            <input type="text" id="cNote" placeholder="NOT / AÇIKLAMA">
            <input type="number" id="cAdet" placeholder="ADET" oninput="engine()">
            <input type="text" id="cTE" placeholder="T.E. (Örn: 1,25)" oninput="engine()">
            <input type="text" id="cPro" placeholder="PRO / ÇARPAN" oninput="engine()">
            <input type="text" id="cRes" placeholder="TOPLAM SONUÇ" readonly>
            <button class="btn" onclick="addRow()">LİSTEYE EKLE</button>
        </div>
    </div>

    <div id="tab-arsiv" class="tab-content">
        <div class="card" id="archiveListContainer"></div>
    </div>

    <div id="tab-ayarlar" class="tab-content">
        <div class="card">
            <button class="btn btn-danger" onclick="resetEverything()">TÜM VERİLERİ SİL</button>
        </div>
    </div>

    <script>
        // BURAYA GOOGLE LİNKİNİ YAPIŞTIR
        const SCRIPT_URL = "BURAYA_GOOGLE_LİNKİNİ_KOY";

        const STORAGE_KEY = 'v139_history';

        function engine() {
            const a = parseBox('cAdet'), t = parseBox('cTE');
            const v = parseBox('cPro') || 1;
            if (a !== null && t !== null) {
                document.getElementById('cRes').value = ((a * t) / v).toFixed(2).replace('.', ',');
            }
        }

        function parseBox(id) {
            let val = document.getElementById(id).value.toString().replace(',', '.');
            return val === "" ? null : parseFloat(val);
        }

        function sendToGoogle(data) {
            if(SCRIPT_URL.includes("BURAYA")) return;
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
        }

        function addRow() {
            const rowData = {
                tarih: new Date().toLocaleString('tr-TR'),
                art: document.getElementById('cArt').value.toUpperCase() || '-',
                note: document.getElementById('cNote').value || '-',
                adet: document.getElementById('cAdet').value || 0,
                te: document.getElementById('cTE').value || 0,
                res: document.getElementById('cRes').value || "0,00"
            };

            // Yerel kayıt
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            history.unshift(rowData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

            // Google Sheets'e gönder
            sendToGoogle(rowData);

            renderArchive();
            alert("Kaydedildi!");
        }

        function renderArchive() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const container = document.getElementById('archiveListContainer');
            container.innerHTML = history.map(item => `<div>${item.tarih} - ${item.art} - ${item.res}</div>`).join('<hr>');
        }

        function resetEverything() {
            if(confirm("Emin misiniz?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
        }

        renderArchive();
    </script>
</body>
</html>
