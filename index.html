<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Üretim Takip Pro v142.3 - Sıkı Denetim</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --input: #21262d;
            --accent: #58a6ff; --success: #238636; --danger: #f85149; --text: #c9d1d9; --purple: #8957e5;
            --border: #30363d;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab-btn { padding: 12px 18px; background: var(--input); color: #8b949e; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; background: var(--input); border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 14px; }
        .btn { padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; font-size: 14px; margin-bottom: 5px; }
        .btn-add { background: var(--accent); color: white; margin-top: 10px; }
        .btn-finish { background: var(--purple); color: white; margin-top: 15px; }
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #21262d; padding: 10px; text-align: left; font-size: 11px; color: #8b949e; }
        td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .total-row { background: #1c2128; font-weight: bold; color: var(--accent); }
        .scanner-container { width: 100%; border-radius: 12px; overflow: hidden; display: none; margin-bottom: 15px; border: 1px solid var(--accent); }
        .search-box { margin-bottom: 15px; position: relative; }
        .search-box input { border: 1px solid var(--accent); padding-left: 35px; background: #1c2128; }
        .search-box::before { content: "🔍"; position: absolute; left: 12px; top: 12px; font-size: 14px; z-index: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1', this)">🏠 ÜRETİM</button>
        <button class="tab-btn" onclick="switchTab('tab-kayit', this)">🏷️ REHBER</button>
        <button class="tab-btn" onclick="switchTab('tab-arsiv', this); renderArchive();">📜 ARŞİV</button>
    </div>

    <!-- ÜRETİM SEKEMESİ -->
    <div id="tab1" class="tab-content active">
        <div class="card">
            <div id="readerUretim" class="scanner-container"></div>
            <button class="btn btn-scan" id="scanBtnUretim" onclick="toggleScanner('readerUretim', 'cArt', 'scanBtnUretim')" style="background: #30363d; color: var(--accent); border: 1px solid var(--accent); padding: 10px; font-size: 12px; margin-bottom: 10px; width:100%; border-radius:8px;">📷 AUFTRAG BARKODU TARA</button>
            <div style="margin-bottom: 12px;"><label>Tarih</label><input type="date" id="targetDate"></div>
            <div class="grid-inputs">
                <div style="grid-column: span 2;"><label>Auftrag</label><input type="text" id="cArt" oninput="fetchTE(this.value)"></div>
                <div><label>Adet</label><input type="number" id="cAdet" oninput="engine()"></div>
                <div><label>TE</label><input type="number" id="cTE" oninput="engine()" step="0.001"></div>
                <div><label>Verim (v)</label><input type="number" id="cPro" oninput="engine()" placeholder="1.0" step="0.1"></div>
                <div><label>Dakika (Net)</label><input type="text" id="cRes" readonly style="color:var(--accent); font-weight:bold;"></div>
                <div><label>Rüst</label><input type="number" id="cRust" oninput="calcSum()"></div>
                <div><label>GMK</label><input type="number" id="cGMK" oninput="calcSum()"></div>
            </div>
            <button class="btn btn-add" onclick="addRow()">LİSTEYE EKLE</button>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>AUFTRAG</th><th>ADET</th><th>TE</th><th>V</th><th>DK</th><th>R</th><th>G</th><th>❌</th></tr></thead>
                    <tbody id="dailyBody"></tbody>
                    <tfoot>
                        <tr class="total-row"><td colspan="4">TOPLAM:</td><td id="sumRes">0,00</td><td id="sumRust">0</td><td id="sumGMK">0</td><td></td></tr>
                    </tfoot>
                </table>
            </div>
            <button class="btn btn-finish" onclick="finishDay()">GÜNÜ BİTİR VE ARŞİVLE</button>
        </div>
    </div>

    <!-- REHBER SEKEMESİ -->
    <div id="tab-kayit" class="tab-content">
        <div class="card">
            <div id="readerRehber" class="scanner-container"></div>
            <button class="btn btn-scan" id="scanBtnRehber" onclick="toggleScanner('readerRehber', 'dbArt', 'scanBtnRehber')" style="background: #30363d; color: var(--accent); border: 1px solid var(--accent); padding: 10px; font-size: 12px; margin-bottom: 10px; width:100%; border-radius:8px;">📷 REHBER İÇİN BARKOD TARA</button>
            <div class="grid-inputs" style="margin-top: 10px;">
                <div><label>ARTİKEL (Auftrag)</label><input type="text" id="dbArt"></div>
                <div><label>TE</label><input type="number" id="dbTE" step="0.001"></div>
                <div style="grid-column: span 2;"><label>NOT (Opsiyonel Açıklama)</label><input type="text" id="dbNote" placeholder="Açıklama girin"></div>
            </div>
            <button class="btn btn-add" onclick="saveDb()">BULUTA KAYDET</button>
            
            <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">
            
            <div class="search-box">
                <input type="text" id="dbSearch" placeholder="Rehberde ara (Artikel veya Not)..." oninput="renderDbList()">
            </div>

            <div class="table-wrapper">
                <table id="dbTable">
                    <thead><tr><th>ARTİKEL</th><th>TE</th><th>NOT</th><th>SİL</th></tr></thead>
                    <tbody id="dbListBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="tab-arsiv" class="tab-content">
        <div id="archiveListContainer"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBfU8df7h3uHYfshaa4Ch6Z-tbB-y5zKJ8",
        authDomain: "firmak-c457f.firebaseapp.com",
        databaseURL: "https://firmak-c457f-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "firmak-c457f",
        storageBucket: "firmak-c457f.appspot.com",
        messagingSenderId: "521525493127",
        appId: "1:521525493127:web:e8a611de175ea9ea44a722"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const rehberRef = db.ref('rehber');

    let globalRehber = [];
    rehberRef.on('value', (snapshot) => {
        const data = snapshot.val();
        globalRehber = [];
        if(data) {
            Object.keys(data).forEach(key => {
                globalRehber.push({id: key, ...data[key]});
            });
        }
        renderDbList();
    });

    const STORAGE_KEY = 'PRO_V141_DATA';
    let html5QrCode;

    function engine() {
        const a = parseFloat(document.getElementById('cAdet').value) || 0;
        const t = parseFloat(document.getElementById('cTE').value) || 0;
        const vInput = document.getElementById('cPro').value;
        const v = (vInput === "" || parseFloat(vInput) === 0) ? 1.0 : parseFloat(vInput);
        const result = (a * t) / v;
        document.getElementById('cRes').value = result.toFixed(2).replace('.', ',');
    }

    function addRow() {
        const art = document.getElementById('cArt').value.toUpperCase();
        if(!art) return alert("Auftrag girin!");
        const vInput = document.getElementById('cPro').value;
        const vSave = (vInput === "" || parseFloat(vInput) === 0) ? "1.0" : vInput;

        const info = {
            art, adet: document.getElementById('cAdet').value || 0,
            te: document.getElementById('cTE').value || 0,
            pro: vSave,
            res: document.getElementById('cRes').value.replace(',', '.') || 0,
            rust: document.getElementById('cRust').value || 0,
            gmk: document.getElementById('cGMK').value || 0,
            id: Date.now()
        };
        const tr = document.createElement('tr');
        tr.id = `row-${info.id}`;
        tr.dataset.info = JSON.stringify(info);
        tr.innerHTML = `<td>${info.art}</td><td>${info.adet}</td><td>${info.te}</td><td>${info.pro}</td><td style="color:var(--accent); font-weight:bold;">${info.res.toString().replace('.',',')}</td><td>${info.rust}</td><td>${info.gmk}</td><td><button onclick="this.closest('tr').remove(); calcSum();" style="color:red; background:none; border:none;">❌</button></td>`;
        document.getElementById('dailyBody').appendChild(tr);
        calcSum();
        ['cArt','cAdet','cTE','cRes','cRust','cGMK', 'cPro'].forEach(id => document.getElementById(id).value = "");
    }

    function saveDb() {
        const art = document.getElementById('dbArt').value.toUpperCase().trim();
        const teValue = document.getElementById('dbTE').value;
        const note = document.getElementById('dbNote').value.trim() || "-";
        
        if(!art || !teValue) return alert("Artikel ve TE zorunludur!");
        const te = parseFloat(teValue);

        // --- ENGELEME MANTIĞI ---
        // Sadece Artikel ve TE aynı mı diye bakıyoruz. Not önemli değil.
        const isDuplicate = globalRehber.find(x => 
            x.art === art && 
            parseFloat(x.te) === te
        );

        if(isDuplicate) {
            alert(`🛑 HATA: "${art}" Artikel numarası ve "${te}" TE değeri ile zaten bir kayıt var. Aynı bilgiyi tekrar ekleyemezsiniz.`);
            return; // Firebase'e göndermeyi durdurur.
        }
        
        rehberRef.push({art, te, note}).then(() => {
            document.getElementById('dbArt').value="";
            document.getElementById('dbTE').value="";
            document.getElementById('dbNote').value="";
            alert("✅ Kaydedildi.");
        });
    }

    function deleteDb(id, artName) {
        if(confirm(`"${artName}" parçası buluttan kalıcı olarak SİLİNECEK. Emin misiniz?`)) {
            db.ref('rehber/' + id).remove();
        }
    }

    function renderDbList() {
        const searchTerm = document.getElementById('dbSearch').value.toUpperCase();
        const filtered = globalRehber.filter(i => 
            i.art.toUpperCase().includes(searchTerm) || 
            (i.note && i.note.toUpperCase().includes(searchTerm))
        );

        document.getElementById('dbListBody').innerHTML = filtered.map((i) => `
            <tr>
                <td>${i.art}</td>
                <td>${i.te}</td>
                <td style="color:#8b949e; font-size:12px;">${i.note || "-"}</td>
                <td><button onclick="deleteDb('${i.id}', '${i.art}')" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px;">🗑️</button></td>
            </tr>`).join('');
    }

    function fetchTE(v) {
        const match = globalRehber.find(x => x.art === v.toUpperCase().trim());
        if(match) { 
            document.getElementById('cTE').value = match.te; 
            engine(); 
        }
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }

    function toggleScanner(readerId, targetInputId, btnId) {
        const readerDiv = document.getElementById(readerId);
        const btn = document.getElementById(btnId);
        if (readerDiv.style.display === 'none' || !readerDiv.style.display) {
            readerDiv.style.display = 'block'; btn.innerText = "🛑 TARAMAYI KAPAT";
            html5QrCode = new Html5Qrcode(readerId);
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, (decodedText) => {
                const cleanText = decodedText.trim().toUpperCase();
                document.getElementById(targetInputId).value = cleanText;
                if(targetInputId === 'cArt') fetchTE(cleanText);
                stopScanner(readerDiv, btn);
            });
        } else { stopScanner(readerDiv, btn); }
    }

    function stopScanner(div, btn) {
        if(html5QrCode) html5QrCode.stop().then(() => {
            div.style.display = 'none';
            btn.innerText = (btn.id === 'scanBtnUretim') ? "📷 AUFTRAG BARKODU TARA" : "📷 REHBER İÇİN BARKOD TARA";
        });
    }

    function calcSum() {
        let total = 0, r = 0, g = 0;
        document.querySelectorAll("#dailyBody tr").forEach(tr => {
            const d = JSON.parse(tr.dataset.info);
            total += parseFloat(d.res); r += parseFloat(d.rust); g += parseFloat(d.gmk);
        });
        document.getElementById('sumRes').innerText = total.toFixed(2).replace('.', ',');
        document.getElementById('sumRust').innerText = r;
        document.getElementById('sumGMK').innerText = g;
    }

    function finishDay() {
        const rows = document.querySelectorAll("#dailyBody tr");
        if(rows.length === 0) return alert("Liste boş!");
        const [y, m, d] = document.getElementById('targetDate').value.split("-");
        const formattedDate = `${d}.${m}.${y}`;
        const dayRecord = { date: formattedDate, items: Array.from(rows).map(r => JSON.parse(r.dataset.info)) };
        let arc = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        arc.unshift(dayRecord);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arc));
        document.getElementById('dailyBody').innerHTML = "";
        calcSum(); alert("Gün arşivlendi!"); renderArchive();
    }

    function renderArchive() {
        const arc = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const container = document.getElementById('archiveListContainer');
        container.innerHTML = arc.map((day, idx) => `
            <div class="card" style="border: 1px solid var(--border); padding:0; overflow:hidden;">
                <div style="background: #1c2128; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <strong>📅 ${day.date}</strong>
                    <button onclick="deleteArchive(${idx})" style="background:var(--danger); color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">SİL</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>AUFTRAG</th><th>ADET</th><th>V</th><th>DK</th><th>R</th><th>G</th></tr></thead>
                        <tbody>${day.items.map(i => `<tr><td>${i.art}</td><td>${i.adet}</td><td>${i.pro}</td><td>${i.res.toString().replace('.',',')}</td><td>${i.rust}</td><td>${i.gmk}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
            </div>`).join('') || '<div class="card">Arşiv henüz boş.</div>';
    }

    function deleteArchive(idx) { if(confirm("Silinsin mi?")) { let arc = JSON.parse(localStorage.getItem(STORAGE_KEY)); arc.splice(idx, 1); localStorage.setItem(STORAGE_KEY, JSON.stringify(arc)); renderArchive(); } }

    window.onload = () => {
        document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
        renderArchive();
    };
</script>
</body>
</html>
