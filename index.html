<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Üretim Takip Pro v148 - Verim Boş</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --input: #21262d;
            --accent: #58a6ff; --success: #238636; --danger: #f85149; --text: #c9d1d9; --purple: #8957e5;
            --border: #30363d;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--border); overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 12px 20px; background: var(--input); color: #8b949e; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .tab-btn.active { background: var(--accent) !important; color: white !important; }
        .tab-content { display: none; width: 100%; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; background: var(--input); border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 14px; }
        .btn { padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }
        .btn-add { background: var(--accent); color: white; margin-top: 10px; }
        .btn-finish { background: var(--purple); color: white; margin-top: 15px; }
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #21262d; padding: 10px; text-align: left; font-size: 11px; color: #8b949e; }
        td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .calc-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; background: #0d1117; padding: 10px; border-radius: 8px; border: 1px dashed var(--border); }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="nav-tab1" class="tab-btn active" onclick="universalTab('tab1')">🏠 ÜRETİM</button>
        <button id="nav-tab2" class="tab-btn" onclick="universalTab('tab2')">🏷️ REHBER</button>
        <button id="nav-tab3" class="tab-btn" onclick="universalTab('tab3')">📜 ARŞİV</button>
    </div>

    <div id="tab1" class="tab-content" style="display: block;">
        <div class="card">
            <div id="readerUretim" style="display:none; border-radius:12px; overflow:hidden; margin-bottom:10px; border:1px solid var(--accent);"></div>
            <button class="btn" onclick="toggleScanner('readerUretim', 'cArt')" style="background:#30363d; color:var(--accent);">📷 BARKOD TARA</button>
            <div style="margin-top:10px;"><label>Tarih</label><input type="date" id="targetDate"></div>
            <div class="grid-inputs" style="margin-top:10px;">
                <div style="grid-column: span 2;"><label>Auftrag</label><input type="text" id="cArt" oninput="fetchTE(this.value)"></div>
                <div><label>Adet</label><input type="number" id="cAdet" oninput="safeEngine('adet')"></div>
                <div><label>TE</label><input type="number" id="cTE" oninput="safeEngine('te')" step="0.001"></div>
                <div><label>Verim (v)</label><input type="number" id="cPro" oninput="safeEngine('verim')" placeholder="1.0" step="0.1"></div>
                <div><label>Dakika (Net)</label><input type="number" id="cRes" oninput="safeEngine('dakika')" step="0.01"></div>
                <div><label>Rüst</label><input type="number" id="cRust" value="0"></div>
                <div><label>GMK</label><input type="number" id="cGMK" value="0"></div>
                <input type="hidden" id="cRefa">
            </div>
            <button class="btn btn-add" onclick="addRow()">LİSTEYE EKLE</button>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>AUFTRAG</th><th>ADET</th><th>V</th><th>DK (Net)</th><th>R</th><th>G</th><th>❌</th></tr></thead>
                    <tbody id="dailyBody"></tbody>
                </table>
            </div>
            <div class="calc-panel">
                <div><label>TOPLAM (Dk+R+G)</label><div id="grandTotalLabel" style="font-size: 18px; font-weight: bold; color: var(--accent);">0.00</div></div>
                <div><label>HEDEF DAKİKA</label><input type="number" id="targetLimit" value="480" oninput="calcSum()" style="height:30px;"></div>
                <div style="grid-column: span 2; text-align: center; border-top: 1px solid var(--border); padding-top: 8px;">
                    <span id="diffLabel" style="font-weight: bold;">KALAN: 480.00 dk</span>
                </div>
            </div>
            <button class="btn btn-finish" onclick="finishDay()">GÜNÜ BİTİR VE ARŞİVLE</button>
        </div>
    </div>

    <div id="tab2" class="tab-content">
        <div class="card">
            <div class="grid-inputs">
                <div><label>ARTİKEL</label><input type="text" id="dbArt"></div>
                <div><label>TE</label><input type="number" id="dbTE" step="0.001"></div>
                <div><label>REFA</label><input type="text" id="dbRefa"></div>
                <div><label>NOT</label><input type="text" id="dbNote"></div>
            </div>
            <button class="btn btn-add" onclick="saveDb()">BULUTA KAYDET</button>
            <div class="table-wrapper" style="margin-top:15px;">
                <table><thead><tr><th>ARTİKEL</th><th>TE</th><th>REFA</th><th>SİL</th></tr></thead><tbody id="dbListBody"></tbody></table>
            </div>
        </div>
    </div>

    <div id="tab3" class="tab-content">
        <div class="card">
            <input type="text" id="archiveSearch" placeholder="Tarih Ara (GG.AA.YYYY)" oninput="renderArchive()" style="margin-bottom:10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" onclick="exportJSON()" style="background:#1c2128; color:#aff5b4; border:1px solid var(--success); font-size:12px;">📥 YEDEK AL</button>
                <button class="btn" onclick="document.getElementById('importFile').click()" style="background:#1c2128; color:#ffab70; border:1px solid #ff7b72; font-size:12px;">📤 YÜKLE</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
        <div id="archiveListContainer"></div>
    </div>
</div>

<script>
    function universalTab(id) {
        document.getElementById('tab1').style.display = 'none';
        document.getElementById('tab2').style.display = 'none';
        document.getElementById('tab3').style.display = 'none';
        document.getElementById('nav-tab1').classList.remove('active');
        document.getElementById('nav-tab2').classList.remove('active');
        document.getElementById('nav-tab3').classList.remove('active');
        document.getElementById(id).style.display = 'block';
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'tab3') renderArchive();
    }

    function safeEngine(source) {
        let adet = parseFloat(document.getElementById('cAdet').value);
        let te = parseFloat(document.getElementById('cTE').value);
        // Verim boşsa 1.0 al:
        let verimInput = document.getElementById('cPro').value;
        let verim = (verimInput === "" || isNaN(parseFloat(verimInput))) ? 1.0 : parseFloat(verimInput);
        let dakika = parseFloat(document.getElementById('cRes').value);

        if (source === 'dakika') {
            if (dakika > 0 && te > 0) {
                document.getElementById('cAdet').value = Math.round((dakika * verim) / te);
            }
        } else {
            if (adet > 0 && te > 0) {
                document.getElementById('cRes').value = ((adet * te) / verim).toFixed(2);
            }
        }
    }

    const firebaseConfig = {
        apiKey: "AIzaSyBfU8df7h3uHYfshaa4Ch6Z-tbB-y5zKJ8",
        authDomain: "firmak-c457f.firebaseapp.com",
        databaseURL: "https://firmak-c457f-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "firmak-c457f",
        storageBucket: "firmak-c457f.appspot.com",
        messagingSenderId: "521525493127",
        appId: "1:521525493127:web:e8a611de175ea9ea44a722"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const rehberRef = db.ref('rehber');
    let globalRehber = [];
    const STORAGE_KEY = 'FIRMAK_PRO_ARCHIVE_V1';

    rehberRef.on('value', (snap) => {
        globalRehber = [];
        const data = snap.val();
        if(data) Object.keys(data).forEach(k => globalRehber.push({id: k, ...data[k]}));
        renderDbList();
    });

    function fetchTE(v) {
        const m = globalRehber.find(x => x.art === v.toUpperCase().trim());
        if(m) { 
            document.getElementById('cTE').value = m.te; 
            document.getElementById('cRefa').value = m.refa || "-";
            safeEngine('te');
        }
    }

    function addRow() {
        const art = document.getElementById('cArt').value.toUpperCase();
        if(!art) return alert("Auftrag gir!");
        let vVal = document.getElementById('cPro').value;
        const info = {
            art, adet: document.getElementById('cAdet').value, te: document.getElementById('cTE').value,
            verim: vVal === "" ? "1.0" : vVal, res: document.getElementById('cRes').value,
            rust: document.getElementById('cRust').value || 0, gmk: document.getElementById('cGMK').value || 0,
            refa: document.getElementById('cRefa').value || "-", id: Date.now()
        };
        const tr = document.createElement('tr');
        tr.dataset.info = JSON.stringify(info);
        tr.innerHTML = `<td>${info.art}</td><td>${info.adet}</td><td>${info.verim}</td><td>${info.res}</td><td>${info.rust}</td><td>${info.gmk}</td>
                        <td><button onclick="this.closest('tr').remove(); calcSum();" style="color:red; background:none; border:none; font-weight:bold;">❌</button></td>`;
        document.getElementById('dailyBody').appendChild(tr);
        calcSum();
        ['cArt','cAdet','cTE','cRes','cRust','cGMK','cPro'].forEach(id => document.getElementById(id).value = "");
    }

    function calcSum() {
        let net = 0, rst = 0, gmk = 0;
        document.querySelectorAll("#dailyBody tr").forEach(tr => {
            const d = JSON.parse(tr.dataset.info);
            net += parseFloat(d.res || 0);
            rst += parseFloat(d.rust || 0);
            gmk += parseFloat(d.gmk || 0);
        });
        const total = net + rst + gmk;
        const target = parseFloat(document.getElementById('targetLimit').value) || 0;
        document.getElementById('grandTotalLabel').innerText = total.toFixed(2);
        const diff = target - total;
        const diffLabel = document.getElementById('diffLabel');
        diffLabel.innerText = `KALAN: ${diff.toFixed(2)} dk`;
        diffLabel.style.color = diff < 0 ? '#f85149' : '#aff5b4';
    }

    function finishDay() {
        const rows = document.querySelectorAll("#dailyBody tr");
        if(rows.length === 0) return alert("Liste boş!");
        const rawDate = document.getElementById('targetDate').value || new Date().toISOString().split('T')[0];
        const dayRecord = {
            date: rawDate.split("-").reverse().join("."),
            items: Array.from(rows).map(r => JSON.parse(r.dataset.info)),
            totalDk: document.getElementById('grandTotalLabel').innerText,
            id: Date.now()
        };
        let archive = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        archive.unshift(dayRecord);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(archive));
        document.getElementById('dailyBody').innerHTML = "";
        calcSum();
        alert("Arşivlendi!");
        universalTab('tab3');
    }

    function renderArchive() {
        const archive = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const search = document.getElementById('archiveSearch').value;
        const container = document.getElementById('archiveListContainer');
        const filtered = archive.filter(day => day.date.includes(search));
        container.innerHTML = filtered.map((day, dIdx) => `
            <div class="card" style="padding:0; overflow:hidden;">
                <div style="background:#1c2128; padding:10px; display:flex; justify-content:space-between; border-bottom:1px solid #30363d;">
                    <b style="color:var(--accent)">📅 ${day.date}</b>
                    <button onclick="deleteDay(${dIdx})" style="background:var(--danger); color:white; border:none; padding:3px 8px; border-radius:4px; font-size:10px;">SİL</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>AUFTRAG</th><th>ADET</th><th>DK</th><th>R</th><th>G</th></tr></thead>
                        <tbody>${day.items.map(i => `<tr><td>${i.art}</td><td>${i.adet}</td><td>${i.res}</td><td>${i.rust}</td><td>${i.gmk}</td></tr>`).join('')}</tbody>
                        <tfoot><tr style="background:#161b22; font-weight:bold; color:var(--accent);"><td colspan="3">TOPLAM:</td><td colspan="2">${day.totalDk} DK</td></tr></tfoot>
                    </table>
                </div>
            </div>`).join('');
    }

    function deleteDay(idx) { if(confirm("Silinsin mi?")) { let arc = JSON.parse(localStorage.getItem(STORAGE_KEY)); arc.splice(idx,1); localStorage.setItem(STORAGE_KEY, JSON.stringify(arc)); renderArchive(); } }
    
    function saveDb() {
        const art = document.getElementById('dbArt').value.toUpperCase();
        const te = document.getElementById('dbTE').value;
        if(!art || !te) return alert("Eksik!");
        rehberRef.push({art, te: parseFloat(te), refa: document.getElementById('dbRefa').value, note: document.getElementById('dbNote').value});
        alert("Kaydedildi!");
        ['dbArt','dbTE','dbRefa','dbNote'].forEach(id => document.getElementById(id).value = "");
    }
    
    function renderDbList() { document.getElementById('dbListBody').innerHTML = globalRehber.map(i => `<tr><td>${i.art}</td><td>${i.te}</td><td>${i.refa}</td><td><button onclick="deleteDb('${i.id}')" style="color:var(--danger); background:none; border:none;">🗑️</button></td></tr>`).join(''); }
    
    function deleteDb(id) { if(confirm("Silinsin mi?")) db.ref('rehber/' + id).remove(); }
    
    function exportJSON() { const data = localStorage.getItem(STORAGE_KEY); if(!data) return; const blob = new Blob([data], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Arsiv_Yedek.json`; a.click(); }
    
    function importJSON(event) { const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const d = JSON.parse(e.target.result); localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); renderArchive(); alert("Yüklendi!"); } catch(e) {alert("Hata!")} }; reader.readAsText(file); }

    function toggleScanner(rid, tid) {
        const rd = document.getElementById(rid);
        if (rd.style.display === 'none') {
            rd.style.display = 'block';
            const h = new Html5Qrcode(rid);
            h.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t) => {
                document.getElementById(tid).value = t.trim().toUpperCase();
                fetchTE(t);
                h.stop().then(() => { rd.style.display = 'none'; });
            });
        } else { rd.style.display = 'none'; }
    }

    window.onload = () => { document.getElementById('targetDate').value = new Date().toISOString().split('T')[0]; };
</script>
</body>
</html>
